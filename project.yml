name: api-ratelimit
description: Kentik envoy rate limiter fork
version: TAG
target:
  build: make -f Makefile.kentik all install
  test: kbt go-mod-tests
nomad:
  - config_dir: controlplane-ratelimit
    pack: service
    branch: main
docker:
  build:
    base: kt-build-generic-trixie:master
  run:
    base: kt-run-generic-trixie:master

team_mappings:
- team: infra
  support:
    pagerduty_service:
      prefix: Infra-Runtime-
